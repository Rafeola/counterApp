<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Counter App: un contatore realizzato in JavaScript puro con creazione dinamica del DOM.">
  <title>Counter App</title>

  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <!-- I file JS vengono caricati in ordine: prima i moduli di supporto, poi app.js che li collega -->
  <script src="js/storage.js" defer></script>
  <script src="js/counter.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Contenitore vuoto: tutta l'interfaccia viene creata da JavaScript (js/ui.js) -->
  <main id="app" class="appRoot"></main>

  <noscript>
    <p class="noScriptMessage">Per usare il counter è necessario abilitare JavaScript.</p>
  </noscript>
</body>
</html>
